name: job-agent-hourly

on:
  schedule:
    # Runs every hour at minute 0 (24/7 in the cloud)
    - cron: "0 * * * *"
    # 02:30 UTC = 08:00 IST -> also builds daily digest
    - cron: "30 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: job-agent
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run Job Agent (Scan & Telegram Alert)
        env:
          DRY_RUN: "false"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: |
          if [ "${{ github.event.schedule }}" = "30 2 * * *" ]; then
            echo "Running daily digest and live alerts..."
            python main.py --live
            python main.py --alerts --live
          else
            echo "Running hourly Indian job alert check..."
            python main.py --alerts --live
          fi

      - name: Commit & push updated tracker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ digests/
          git diff --staged --quiet || (git commit -m "Auto-update job tracker [skip ci]" && git pull --rebase && git push)
